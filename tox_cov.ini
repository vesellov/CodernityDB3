[tox]
envlist=py314
skip_missing_interpreters=true

[testenv:pypy]
basepython=/usr/local/bin/pypy

[testenv:pypy-dev]
basepython=/usr/local/bin/pypy-dev

[testenv]
deps=
        pytest
        pytest-cov
        pytest-xdist
commands=
    py.test --junitxml=junit-norm-{envname}.xml --cov-report=html --cov-report=xml --cov CodernityDB3 tests/test_db.py
    py.test --junitxml=junit-patch-{envname}.xml --cov-report=html --cov-report=xml --cov CodernityDB3 tests/test_patch.py
    py.test --junitxml=junit-thread-safe-{envname}.xml --cov-report=html --cov-report=xml --cov CodernityDB3 tests/test_db_thread_safe.py
    py.test --junitxml=junit-super-thread-safe-{envname}.xml --cov-report=html --cov-report=xml --cov CodernityDB3 tests/test_db_super_thread_safe.py
    py.test --junitxml=junit-indexcreator-{envname}.xml --cov-report=html --cov-report=xml --cov CodernityDB3 tests/test_indexcreator_db.py tests/test_indexcreator_exec.py
